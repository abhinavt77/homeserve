server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    context-path: /api

spring:
  application:
    name: homeserve
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:homeservedb}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:homeserve_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:homeserve_pass}}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:noreply@homeserve.local}
    password: ${SPRING_MAIL_PASSWORD:password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: false

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:rzp_test_homeserveKeyId123}
    key-secret: ${RAZORPAY_KEY_SECRET:homeserveRazorpaySecretMock456}
    currency: ${RAZORPAY_CURRENCY:INR}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:homeserve-cloud}
    api-key: ${CLOUDINARY_API_KEY:123456789012345}
    api-secret: ${CLOUDINARY_API_SECRET:homeserve_cloudinary_secret_sample}
  matching:
    initial-radius-km: ${MATCHING_INITIAL_RADIUS_KM:15.0}
    expanded-radius-km: ${MATCHING_EXPANDED_RADIUS_KM:35.0}
    timeout-minutes: ${MATCHING_TIMEOUT_MINUTES:5}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
